{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="narrow">
  <h1>{{ title }}</h1>
  <form method="post" class="card">{% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn primary">Save</button>
    <a class="btn" href="{% url 'user_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
